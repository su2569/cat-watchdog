name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

env:
  BUILD_TYPE: Release

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j$(nproc)
      - name: Strip binary
        run: strip build/cat-watchdog
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cat-watchdog-linux-amd64
          path: build/cat-watchdog

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cat-watchdog-windows-amd64
          path: build/${{ env.BUILD_TYPE }}/cat-watchdog.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j$(sysctl -n hw.ncpu)
      - name: Strip binary
        run: strip build/cat-watchdog
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cat-watchdog-macos-amd64
          path: build/cat-watchdog

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package binaries
        run: |
          mkdir -p release
          cd artifacts
          for dir in */; do
            name=$(basename "$dir")
            if [ -f "$dir/cat-watchdog" ]; then
              tar czf "../release/${name}.tar.gz" -C "$dir" cat-watchdog
            elif [ -f "$dir/cat-watchdog.exe" ]; then
              zip -j "../release/${name}.zip" "$dir/cat-watchdog.exe"
            fi
          done
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
